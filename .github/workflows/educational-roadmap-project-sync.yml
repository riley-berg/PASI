name: "Educational Roadmap Project #6 sync"

on:
  issues:
    types: [opened, reopened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Existing PASI issue number with the roadmap label"
        required: true
        type: number
  push:
    branches: [main]
    paths:
      - ".github/workflows/educational-roadmap-project-sync.yml"
      - "scripts/add_educational_roadmap_project_item.py"

permissions:
  contents: read
  issues: read

concurrency:
  group: educational-roadmap-project6-item-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out PASI
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Add roadmap issue and assign metadata
        env:
          PASI_PROJECTS_TOKEN: ${{ secrets.PASI_PROJECTS_TOKEN }}
          ROADMAP_ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number || 48 }}
        run: python scripts/add_educational_roadmap_project_item.py
