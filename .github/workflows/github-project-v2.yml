name: PASI Project #5 reconciliation

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview the reconciliation without changing Project #5"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - ".github/workflows/github-project-v2.yml"
      - "scripts/github_project_v2.py"
      - "scripts/reconcile_project_metadata.py"
      - "scripts/validate_project5_roadmap.py"
      - "scripts/validate_project5_roadmap_ui.spec.mjs"

permissions:
  contents: read
  issues: write

concurrency:
  group: pasi-project-5-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile Project #5
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out canonical PASI
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Reconcile canonical Project #5
        env:
          PASI_PROJECTS_TOKEN: ${{ secrets.PASI_PROJECTS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${PASI_PROJECTS_TOKEN}" ]]; then
            echo "::error::Repository secret PASI_PROJECTS_TOKEN is required."
            exit 1
          fi

          args=(python scripts/github_project_v2.py --project-number 5)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi

          "${args[@]}"

      - name: Reconcile item metadata and planning fields
        env:
          PASI_PROJECTS_TOKEN: ${{ secrets.PASI_PROJECTS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${PASI_PROJECTS_TOKEN}" ]]; then
            echo "::error::Repository secret PASI_PROJECTS_TOKEN is required."
            exit 1
          fi

          python scripts/reconcile_project_metadata.py

      # The Projects API exposes the date fields and item values, but not the
      # Roadmap Date fields picker mapping. The browser check below is therefore
      # authoritative for Start date = Start date and Target date = Target date.
      - name: Validate Project #5 roadmap API contract
        env:
          PASI_PROJECTS_TOKEN: ${{ secrets.PASI_PROJECTS_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${PASI_PROJECTS_TOKEN}" ]]; then
            echo "::error::Repository secret PASI_PROJECTS_TOKEN is required."
            exit 1
          fi

          python scripts/validate_project5_roadmap.py

      - name: Set up Node.js for Roadmap UI check
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Verify browser-check credentials are configured
        env:
          PASI_GITHUB_USERNAME: ${{ secrets.PASI_GITHUB_USERNAME }}
          PASI_GITHUB_PASSWORD: ${{ secrets.PASI_GITHUB_PASSWORD }}
          PASI_GITHUB_TOTP_SECRET: ${{ secrets.PASI_GITHUB_TOTP_SECRET }}
        run: |
          set -euo pipefail

          if [[ -z "${PASI_GITHUB_USERNAME}" || -z "${PASI_GITHUB_PASSWORD}" ]]; then
            echo "::error::Repository secrets PASI_GITHUB_USERNAME and PASI_GITHUB_PASSWORD are required for the authenticated Roadmap UI check."
            exit 1
          fi

          if [[ -z "${PASI_GITHUB_TOTP_SECRET}" ]]; then
            echo "::error::Repository secret PASI_GITHUB_TOTP_SECRET is required because the browser check must complete GitHub 2FA non-interactively. Use a dedicated test account with TOTP."
            exit 1
          fi

      - name: Install Chromium for Roadmap UI check
        run: npx --yes playwright@1.63.0 install --with-deps chromium

      - name: Verify Project #5 Roadmap Date fields in GitHub UI
        env:
          PASI_GITHUB_USERNAME: ${{ secrets.PASI_GITHUB_USERNAME }}
          PASI_GITHUB_PASSWORD: ${{ secrets.PASI_GITHUB_PASSWORD }}
          PASI_GITHUB_TOTP_SECRET: ${{ secrets.PASI_GITHUB_TOTP_SECRET }}
        run: |
          set -euo pipefail

          npx --yes playwright@1.63.0 test             scripts/validate_project5_roadmap_ui.spec.mjs             --reporter=line             --workers=1             --retries=0

      - name: Verify dry-run configuration
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        env:
          PASI_PROJECTS_TOKEN: ${{ secrets.PASI_PROJECTS_TOKEN }}
          PASI_PROJECT_NUMBER: "5"
        run: |
          set -euo pipefail

          if [[ -z "${PASI_PROJECTS_TOKEN}" ]]; then
            echo "::error::Repository secret PASI_PROJECTS_TOKEN is required."
            exit 1
          fi

          python scripts/github_project_v2.py --project-number 5 --dry-run
