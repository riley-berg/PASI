name: PASI Project #5 reconciliation

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview the reconciliation without changing Project #5"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - ".github/workflows/github-project-v2.yml"
      - "scripts/github_project_v2.py"
      - "scripts/reconcile_project_metadata.py"

permissions:
  contents: read
  issues: write

concurrency:
  group: pasi-project-5-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile Project #5
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out canonical PASI
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Reconcile canonical Project #5
        env:
          PASI_PROJECTS_TOKEN: ${{ secrets.PASI_PROJECTS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${PASI_PROJECTS_TOKEN}" ]]; then
            echo "::error::Repository secret PASI_PROJECTS_TOKEN is required."
            exit 1
          fi

          args=(python scripts/github_project_v2.py --project-number 5)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi

          "${args[@]}"

      - name: Reconcile item metadata and planning fields
        env:
          PASI_PROJECTS_TOKEN: ${{ secrets.PASI_PROJECTS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${PASI_PROJECTS_TOKEN}" ]]; then
            echo "::error::Repository secret PASI_PROJECTS_TOKEN is required."
            exit 1
          fi

          python scripts/reconcile_project_metadata.py

      - name: Validate Project #5 roadmap contract
        env:
          PASI_PROJECTS_TOKEN: ${{ secrets.PASI_PROJECTS_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${PASI_PROJECTS_TOKEN}" ]]; then
            echo "::error::Repository secret PASI_PROJECTS_TOKEN is required."
            exit 1
          fi

          python scripts/validate_project5_roadmap.py

      - name: Verify dry-run configuration
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        env:
          PASI_PROJECTS_TOKEN: ${{ secrets.PASI_PROJECTS_TOKEN }}
          PASI_PROJECT_NUMBER: "5"
        run: |
          set -euo pipefail

          if [[ -z "${PASI_PROJECTS_TOKEN}" ]]; then
            echo "::error::Repository secret PASI_PROJECTS_TOKEN is required."
            exit 1
          fi

          python scripts/github_project_v2.py --project-number 5 --dry-run
