name: PASI branch hygiene

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview safe branch deletions without applying them"
        required: false
        type: boolean
        default: true
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: pasi-branch-hygiene
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run branch hygiene tests
        run: python -m unittest -v scripts.test_cleanup_duplicate_branches

  cleanup:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply safe branch cleanup
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python scripts/cleanup_duplicate_branches.py --json
      - name: Preview safe branch cleanup
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python scripts/cleanup_duplicate_branches.py --dry-run --json
